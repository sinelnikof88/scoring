services:
  php:
    image: webdevops/php-dev:8.3
    container_name: scoring_php
    working_dir: /app/scoring
    volumes:
      - /var/www/scoring:/app
    environment:
      - PHP_DEBUG=1
      - PHP_ERROR_REPORTING=E_ALL
      - WEB_DOCUMENT_ROOT=/app/scoring/public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scoring_net
    command: >
      sh -c "php-fpm -F"
        
    user: "1000:1000"

     
  nginx:
    image: nginx:alpine
    container_name: scoring_nginx
    ports:
      - "8080:80"
    volumes:
      - /var/www/scoring:/app
      - /var/www/scoring/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - scoring_net

  db:
    image: mariadb:11
    container_name: scoring_db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: scoring
      MARIADB_USER: scoring
      MARIADB_PASSWORD: scoring
    ports:
      - "3307:3306"
    volumes:
      - scoring_db_data:/var/lib/mysql
    networks:
      - scoring_net

networks:
  scoring_net:
    driver: bridge

volumes:
  scoring_db_data: